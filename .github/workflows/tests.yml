# The offline suite on Windows and Linux. No key, no network: every model
# call is mocked, so no secret is passed in. Added 2026-10-23 after the
# partner reported Windows problems; keeps the Windows path from regressing.
name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0  # check_progress.py walks the history back to its baseline
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"
      - name: Install (CLI + GUI extras; the GUI tests import streamlit)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-gui.txt
      - name: Line endings are LF after checkout
        shell: bash
        run: |
          if grep -rl $'\r' data/fixtures itdr_agent scripts tests; then
            echo "CRLF found after checkout"; exit 1; fi
      - name: Tests
        run: python -m pytest -q
      - name: PROGRESS.md lists every commit
        run: python scripts/check_progress.py
